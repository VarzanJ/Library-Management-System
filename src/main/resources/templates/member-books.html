<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search books | SEUSL Library</title>
    <link rel="icon" th:href="@{/images/logo.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/script.js}" defer></script>
</head>
<body>
<header>
    <div class="header-inner">
        <div class="brand">
            <img class="logo" th:src="@{/images/logo.png}" alt="SEUSL logo" onerror="this.style.display='none'">
            <h1>SEUSL Library Management System</h1>
        </div>
        <div class="user-info">
            <span th:text="${session.loggedUser.name}"></span>
            <a href="/logout">Log out</a>
        </div>
    </div>
</header>
<nav>
    <a href="/member/dashboard">Dashboard</a>
    <a href="/member/books">Search books</a>
    <a href="/member/my-books">My books</a>
</nav>
<main class="container">
    <div class="page-head"><h2>Search books</h2></div>
    <form class="toolbar" method="get" action="/member/books">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Search books">
        <select name="type">
            <option value="title">Title</option>
            <option value="author">Author</option>
            <option value="isbn">ISBN</option>
            <option value="category">Category</option>
        </select>
        <button type="submit">Search</button>
    </form>

    <table>
        <thead>
            <tr><th>Title</th><th>Author</th><th>ISBN</th><th>Category</th><th>Publisher</th><th>Availability</th><th>Action</th></tr>
        </thead>
        <tbody>
            <tr th:each="b : ${books}">
                <td th:text="${b.title}"></td>
                <td th:text="${b.author}"></td>
                <td th:text="${b.isbn}"></td>
                <td th:text="${b.category}"></td>
                <td th:text="${b.publisher}"></td>
                <td><span class="badge" th:classappend="${b.available} ? 'badge-success' : 'badge-muted'"
                          th:text="${b.available} ? 'Available' : 'Not available'"></span></td>
                <td class="actions">
                    <form th:if="${b.available}" method="post" th:action="@{/member/borrow/{id}(id=${b.id})}"
                          data-confirm="Borrow this book?">
                        <button class="btn-sm" type="submit">Borrow</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(books)}"><td class="empty" colspan="7">No books found.</td></tr>
        </tbody>
    </table>
</main>
<footer>South Eastern University of Sri Lanka &ndash; Library Management System</footer>
</body>
</html>
