<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Manage Books</title></head>
<body>
    <h2>Manage Books</h2>
    <a href="/admin/dashboard">Dashboard</a> |
    <a href="/admin/books/add">Add New Book</a> |
    <a href="/logout">Logout</a>
    <br><br>

    <form method="get" action="/admin/books">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Search...">
        <select name="type">
            <option value="title">Title</option>
            <option value="author">Author</option>
            <option value="isbn">ISBN</option>
            <option value="category">Category</option>
        </select>
        <button type="submit">Search</button>
    </form>
    <br>

    <table border="1" cellpadding="6">
        <tr>
            <th>ID</th><th>Title</th><th>Author</th><th>ISBN</th>
            <th>Category</th><th>Publisher</th><th>Available</th><th>Actions</th>
        </tr>
        <tr th:each="b : ${books}">
            <td th:text="${b.id}"></td>
            <td th:text="${b.title}"></td>
            <td th:text="${b.author}"></td>
            <td th:text="${b.isbn}"></td>
            <td th:text="${b.category}"></td>
            <td th:text="${b.publisher}"></td>
            <td th:text="${b.available} ? 'Yes' : 'No'"></td>
            <td>
                <a th:href="@{/admin/books/edit/{id}(id=${b.id})}">Edit</a> |
                <a th:href="@{/admin/books/delete/{id}(id=${b.id})}"
                   onclick="return confirm('Delete this book?')">Delete</a>
            </td>
        </tr>
    </table>
</body>
</html>
