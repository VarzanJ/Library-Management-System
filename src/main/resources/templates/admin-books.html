<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage books | SEUSL Library</title>
    <link rel="icon" th:href="@{/images/logo.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/script.js}" defer></script>
</head>
<body>
<header>
    <div class="header-inner">
        <div class="brand">
            <img class="logo" th:src="@{/images/logo.png}" alt="SEUSL logo" onerror="this.style.display='none'">
            <h1>SEUSL Library Management System</h1>
        </div>
        <div class="user-info">
            <span th:text="${session.loggedUser.name}"></span>
            <a href="/logout">Log out</a>
        </div>
    </div>
</header>
<nav>
    <a href="/admin/dashboard">Dashboard</a>
    <a href="/admin/books">Books</a>
    <a href="/admin/members">Members</a>
    <a href="/admin/borrow-records">Borrow records</a>
    <a href="/admin/fines">Fines</a>
    <a href="/admin/overdue-books">Overdue books</a>
</nav>
<main class="container">
    <div class="page-head">
        <h2>Manage books</h2>
        <a class="btn" href="/admin/books/add">Add new book</a>
    </div>
    <form class="toolbar" method="get" action="/admin/books">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Search books">
        <select name="type">
            <option value="title">Title</option>
            <option value="author">Author</option>
            <option value="isbn">ISBN</option>
            <option value="category">Category</option>
        </select>
        <button type="submit">Search</button>
    </form>

    <table>
        <thead>
            <tr><th>ID</th><th>Title</th><th>Author</th><th>ISBN</th><th>Category</th><th>Publisher</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody>
            <tr th:each="b : ${books}">
                <td th:text="${b.id}"></td>
                <td th:text="${b.title}"></td>
                <td th:text="${b.author}"></td>
                <td th:text="${b.isbn}"></td>
                <td th:text="${b.category}"></td>
                <td th:text="${b.publisher}"></td>
                <td><span class="badge" th:classappend="${b.available} ? 'badge-success' : 'badge-muted'"
                          th:text="${b.available} ? 'Available' : 'On loan'"></span></td>
                <td class="actions">
                    <a th:href="@{/admin/books/edit/{id}(id=${b.id})}">Edit</a>
                    <a class="link-danger" th:href="@{/admin/books/delete/{id}(id=${b.id})}" data-confirm="Delete this book?">Delete</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(books)}"><td class="empty" colspan="8">No books found.</td></tr>
        </tbody>
    </table>
</main>
<footer>South Eastern University of Sri Lanka &ndash; Library Management System</footer>
</body>
</html>
