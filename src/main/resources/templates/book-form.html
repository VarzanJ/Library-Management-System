<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book details | SEUSL Library</title>
    <link rel="icon" th:href="@{/images/logo.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/script.js}" defer></script>
</head>
<body>
<header>
    <div class="header-inner">
        <div class="brand">
            <img class="logo" th:src="@{/images/logo.png}" alt="SEUSL logo" onerror="this.style.display='none'">
            <h1>SEUSL Library Management System</h1>
        </div>
        <div class="user-info">
            <span th:text="${session.loggedUser.name}"></span>
            <a href="/logout">Log out</a>
        </div>
    </div>
</header>
<nav>
    <a href="/admin/dashboard">Dashboard</a>
    <a href="/admin/books">Books</a>
    <a href="/admin/members">Members</a>
    <a href="/admin/borrow-records">Borrow records</a>
    <a href="/admin/fines">Fines</a>
    <a href="/admin/overdue-books">Overdue books</a>
</nav>
<main class="container">
    <div class="card form-card">
        <h2 th:text="${book.id == null} ? 'Add book' : 'Edit book'"></h2>
        <form method="post" action="/admin/books/save" th:object="${book}">
            <input type="hidden" th:field="*{id}">
            <div class="form-grid">
                <div class="full"><label for="title">Title</label><input type="text" th:field="*{title}" required></div>
                <div><label for="author">Author</label><input type="text" th:field="*{author}" required></div>
                <div><label for="isbn">ISBN</label><input type="text" th:field="*{isbn}"></div>
                <div><label for="category">Category</label><input type="text" th:field="*{category}"></div>
                <div><label for="publisher">Publisher</label><input type="text" th:field="*{publisher}"></div>
                <div class="full"><label class="inline"><input type="checkbox" th:field="*{available}"> Available for loan</label></div>
            </div>
            <div class="form-actions">
                <button type="submit">Save book</button>
                <a href="/admin/books">Cancel</a>
            </div>
        </form>
    </div>
</main>
<footer>South Eastern University of Sri Lanka &ndash; Library Management System</footer>
</body>
</html>
